name: Deploy to production

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch: {}

# A second push while a deploy is running would race the first on the same
# server - queue instead of running two deploys concurrently.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/bestchoice
            # Pull here, not just inside deploy.sh: a running bash script that
            # git-pulls itself mid-execution can keep running the OLD buffered
            # copy for the rest of that run - fetch fresh first so deploy.sh
            # forks as a brand new process reading its own latest content.
            git pull origin main
            ./deploy.sh
